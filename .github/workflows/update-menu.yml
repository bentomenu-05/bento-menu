name: Update Bento Menu
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate menu.json from Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, json, base64, os
          from datetime import datetime, timezone, timedelta
          cloud = os.environ['CLOUD_NAME']
          key = os.environ['API_KEY']
          secret = os.environ['API_SECRET']
          url = f"https://api.cloudinary.com/v1_1/{cloud}/resources/image"
          params = urllib.parse.urlencode({"type":"upload","max_results":500})
          req = urllib.request.Request(f"{url}?{params}")
          creds = base64.b64encode(f"{key}:{secret}".encode()).decode()
          req.add_header("Authorization", f"Basic {creds}")
          res = urllib.request.urlopen(req)
          resources = json.loads(res.read())["resources"]
          print(f"総画像数: {len(resources)}枚")
          for r in resources[:5]:
              print("public_id:", r.get("public_id",""))
              print("asset_folder:", r.get("asset_folder",""))
              print("url:", r.get("secure_url","")[:80])
              print("---")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add menu.json
          git diff --cached --quiet || git commit -m "Update menu $(date '+%Y-%m-%d')"
          git push
