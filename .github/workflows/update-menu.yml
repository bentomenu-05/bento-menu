<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はつね　メニュー</title>
  <style>
    body { font-family: sans-serif; background: #fff8f0; margin: 0; padding: 16px; }
    h1 { text-align: center; color: #d35400; font-size: 1.4rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .grid img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .grid img:hover { transform: scale(1.02); }

    /* モーダル（クリックで拡大） */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
      cursor: pointer;
    }
    #modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🍱 はつね　メニュー</h1>
  <div class="grid" id="menu-container"></div>

  <div id="modal">
    <img id="modal-img" src="">
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    fetch('menu.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('menu-container');
        Object.keys(data).sort().reverse().forEach(week => {
          data[week].forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.loading = 'lazy';
            img.onclick = () => {
              modalImg.src = url;
              modal.style.display = 'flex';
            };
            container.appendChild(img);
          });
        });
      });

    modal.onclick = () => {
      modal.style.display = 'none';
    };
  </script>
</body>
</html>
