<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今週のお弁当メニュー</title>
  <style>
    body { font-family: sans-serif; background: #fff8f0; margin: 0; padding: 16px; }
    h1 { text-align: center; color: #d35400; font-size: 1.4rem; }
    .week-section { margin-bottom: 32px; }
    .week-title { font-size: 1.1rem; font-weight: bold; color: #555;
                  border-left: 4px solid #e67e22; padding-left: 8px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .grid img { width: 100%; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  </style>
</head>
<body>
  <h1>🍱 今週のお弁当メニュー</h1>
  <div id="menu-container">読み込み中...</div>
  <script>
    fetch('menu.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        Object.keys(data).sort().reverse().forEach(week => {
          const section = document.createElement('div');
          section.className = 'week-section';
          section.innerHTML = `<div class="week-title">📅 ${week}</div>
            <div class="grid">${data[week].map(url =>
              `<img src="${url}" loading="lazy">`).join('')}
            </div>`;
          container.appendChild(section);
        });
      });
  </script>
</body>
</html>
